<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeTrack</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* Lado esquerdo com degradê diagonal */
    .left {
      flex: 1;
      background: linear-gradient(135deg, #5F59A0, #342E73);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 60px;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 80px;
    }

    .logo img {
      height: 80px;
    }

    .logo span {
      font-size: 3rem;
      font-weight: bold;
    }

    .left h1 {
      font-size: 2rem;
      line-height: 1.4;
      font-weight: bold;
    }

    /* Lado direito */
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      text-align: center;
    }

    .right p {
      font-size: 1.1rem;
      color: #2c2c54;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 15px;
    }

    .buttons a {
      text-decoration: none;
      padding: 10px 25px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .cadastro {
      background: #342E73;
      color: #e6e6f0;
    }

    .cadastro:hover {
      background: #2a245f;
    }

    .login {
      background: #342E73;
      color: white;
    }

    .login:hover {
      background: #2a245f;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left {
        clip-path: none;
        width: 100%;
        align-items: center;
        text-align: center;
        padding: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Lado esquerdo -->
    <div class="left">
      <div class="logo">
        <img src="assests/logo.png" alt="LifeTrack Logo">
        <span>LifeTrack</span>
      </div>
      <h1>Sua jornada de bem-estar<br>começa aqui!</h1>
    </div>

    <!-- Lado direito -->
    <div class="right">
      <p>Comece hoje sua jornada para<br>uma vida mais saudável.</p>
      <div class="buttons">
        <a href="cadastro.html" class="cadastro">Cadastre-se</a>
        <a href="Login.html" class="login">Login</a>
      </div>
    </div>
  </div>
</body>
</html>
