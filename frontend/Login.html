<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LifeTrack</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      width: 100%;
      padding: 15px 40px;
      background: linear-gradient(90deg, #5F59A0, #342E73);
      display: flex;
      align-items: center;
    }

    .header img {
      height: 35px;
      margin-right: 10px;
    }

    .header span {
      font-size: 1.4rem;
      font-weight: bold;
      color: white;
    }

    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 40px;
    }

    .left-text {
      font-size: 1.3rem;
      color: #2c2c54;
      font-weight: bold;
      text-align: center;
      max-width: 350px;
    }

    .login-box {
      background: #5F59A0;
      padding: 40px 30px;
      border-radius: 20px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .login-box label {
      color: white;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 20px;
      outline: none;
    }

    .links {
      font-size: 0.8rem;
      color: white;
      text-align: center;
      margin-top: -5px;
      margin-bottom: 10px;
    }

    .links a {
      color: white;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .login-box button {
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: #2a245f;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-box button:hover {
      background: #1e1a48;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="assests/logo.png" alt="Logo LifeTrack">
    <span>LifeTrack</span>
  </div>

  <div class="container">
    <div class="left-text">
      Cada login é um passo a<br>
      mais na construção de uma<br>
      rotina saudável.
    </div>

    <form class="login-box" id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Email" required>

      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Senha" required>

      <div class="links">
        <a href="EsqueciSenha.html">Esqueci minha senha</a>
      </div>

      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const senha = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:3000/api/public/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, senha })
        });

        const data = await response.json();

        if (response.ok) {
          // Armazena o token para rotas privadas
          localStorage.setItem("token", data.token);

          // Redireciona para a dashboard após login
          window.location.href = "dash.html";
        } else {
          alert("❌ " + (data.message || "Erro ao realizar login."));
        }
      } catch (error) {
        console.error("Erro:", error);
        alert("⚠️ Erro de conexão com o servidor.");
      }
    });
  </script>
</body>
</html>
