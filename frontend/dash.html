<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeTrack Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; margin:0; }
    .topbar { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#5F59A0; color:#fff; }
    .sidebar { position:fixed; top:50px; left:0; width:60px; height:100%; background:#f2f2ff; display:flex; flex-direction:column; align-items:center; padding-top:20px; }
    .sidebar button { margin:10px 0; border:none; background:none; cursor:pointer; font-size:24px; }
    .main { margin-left:70px; padding:20px; }
    .greeting { margin-bottom:20px; font-size:16px; }

    /* Grid fixado 3 em cima e 2 embaixo */
    .grid { 
      display:grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap:15px; 
    }

    /* Cards */
    .card { background:#f8f8ff; padding:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); text-align:center; }
    .card h3 { margin:0 0 10px 0; color:#5F59A0; }
    .card p { display:flex; justify-content:center; align-items:baseline; margin:0; font-size:18px; font-weight:700; }
    .card .value { margin-right:4px; }
    .card .unit { font-weight:400; font-size:14px; color:#555; }

    /* Responsivo */
    @media(max-width:768px){
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media(max-width:480px){
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">
      <img src="assests/logo.png" alt="LifeTrack" style="height:30px; object-fit:contain;">
      LifeTrack
    </div>
    <div class="icons">⚙️  👤</div>
  </div>

  <div class="sidebar">
    <button title="Home" onclick="location.href='dash.html'">🏠</button>
    <button title="Estatísticas" onclick="location.href='stats.html'">📊</button>
    <button title="Conquistas">🏅</button>
  </div>

  <div class="main">
    <div class="greeting">
      <strong>Olá, usuário!</strong><br>
      Aqui está o resumo do seu dia:
    </div>

    <div class="grid" id="statsGrid">
      <!-- Cards serão gerados pelo JS -->
    </div>
  </div>

  <script>
    // Estatísticas padrão
    const statsDefault = {
      hidratacao: { label: 'Hidratação', unit: 'copos', value: 0 },
      exercicio: { label: 'Exercício', unit: 'min', value: 0 },
      sono: { label: 'Sono', unit: 'h', value: 0 },
      meditacao: { label: 'Meditação', unit: 'min', value: 0 },
      alimentacao: { label: 'Alimentação', unit: 'refeições', value: 0 }
    };

    const statsGrid = document.getElementById('statsGrid');

    // Normaliza nomes (remove acentos e espaços)
    function normalize(str){
      return str.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, "");
    }

    // Carregar registros do stats.html
    const rows = JSON.parse(localStorage.getItem('lifetrack_stats_v1') || '[]');
    const latest = {};
    rows.forEach(r => {
      if (!r.deleted){
        const key = normalize(r.categoria); // Hidratação -> hidratacao
        latest[key] = r.valor;
      }
    });

    // Gerar cards
    Object.keys(statsDefault).forEach(stat => {
      const value = latest[stat] || statsDefault[stat].value;
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-type', stat);
      card.innerHTML = `
        <h3>${statsDefault[stat].label}</h3>
        <p><span class="value">${value}</span><span class="unit">${statsDefault[stat].unit}</span></p>
      `;
      statsGrid.appendChild(card);
    });
  </script>

</body>
</html>
