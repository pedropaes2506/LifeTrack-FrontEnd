services:
  app:
    image: node:22
    # Adicionado para corrigir o erro 'exec format error' em Macs M1/M2/M3 e PCs ARM (Se necessário)
    platform: linux/arm64 
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      # Configuração para o container Node.js se conectar ao MySQL
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: lifetrack
      # String de conexão do Node.js (usa o host 'db' interno)
      DATABASE_URL: "mysql://root:root@db:3306/lifetrack"

    # Comando corrigido: instala dependências e mantém o container vivo
    command: sh -c "npm install && tail -f /dev/null"

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lifetrack
    # Porta mapeada para 3307 (externo) para evitar conflitos na porta 3306 (interno)
    ports:
      - "3307:3306" 
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: