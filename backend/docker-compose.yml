services:
  app:
    image: node:22
    # Adicionado para corrigir o erro 'exec format error' em Macs M1/M2/M3 e PCs ARM
    platform: linux/arm64
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: lifetrack
      # String de conexão completa exigida pelo Prisma
      DATABASE_URL: "mysql://root:root@db:3306/lifetrack"

    # Comando atualizado: instala dependências e INICIA O SERVIDOR COM HOT-RELOAD
    # ⬅️ CORREÇÃO DE DX: Usa tsx watch para recarregar automaticamente.
    command: sh -c "npm install && npx tsx watch server.js" 

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lifetrack
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: